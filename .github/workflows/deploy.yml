name: Scan and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default: read-only access to the repo for every job
permissions:
  contents: read

jobs:
  security-scan:
    name: Security checkpoint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code (full history for secret scanning)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks - scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov - scan Terraform for misconfigurations
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true

      - name: Trivy - scan for vulnerable packages, secrets, and misconfigurations
        # Pinned to a commit SHA (v0.36.0): version tags were hijacked in the March 2026 supply-chain attack
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"

  # Pull requests only: preview changes in all 3 environments, read-only
  plan:
    name: Plan ${{ matrix.environment }}
    needs: security-scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, prod]
    defaults:
      run:
        working-directory: terraform/site
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Terraform (same version as local)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Log in to AWS with OIDC (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Terraform init
        run: terraform init -input=false -backend-config=env/${{ matrix.environment }}.s3.tfbackend

      - name: Terraform plan (no lock - this role can only read)
        run: terraform plan -input=false -lock=false -var-file=env/${{ matrix.environment }}.tfvars

  # Merges to main: dev, then test, then prod (prod waits for your approval)
  dev:
    needs: security-scan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/apply-env.yml
    with:
      environment: dev
    secrets: inherit

  test:
    needs: dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/apply-env.yml
    with:
      environment: test
    secrets: inherit

  prod:
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/apply-env.yml
    with:
      environment: prod
    secrets: inherit
